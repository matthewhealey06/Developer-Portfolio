<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} | {{siteTitle}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="article" />
    <link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{blogPath}}/feed.xml" />
    <link rel="icon" type="image/png" href="/public/images/favicon.png" />
    <link rel="stylesheet" href="/stylesheets/global.css" />
    <link rel="stylesheet" href="/stylesheets/blog.css" />
    <link rel="stylesheet" href="/stylesheets/highlight.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{title}}",
        "datePublished": "{{dateISO}}",
        "author": { "@type": "Person", "name": "Matthew Healey" },
        "url": "{{canonical}}"
      }
    </script>
  </head>
  <body>
    <div id="nav-container"></div>
    <main class="post">
      <article>
        <header class="post-header">
          <h1>{{title}}</h1>
          <p class="meta">
            <time datetime="{{dateISO}}">{{date}}</time> &middot; {{readingTime}} min read
          </p>
          {{tags}}
        </header>
        {{content}}
      </article>
      <p class="back"><a href="{{blogPath}}/">&larr; All notes</a></p>
    </main>
    <div id="footer-container"></div>
    <script src="/public/components.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="/public/global.js"></script>
  </body>
</html>
