<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} | {{siteTitle}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{blogPath}}/feed.xml" />
    <link rel="icon" type="image/png" href="/public/images/favicon.png" />
    <link rel="stylesheet" href="/stylesheets/global.css" />
    <link rel="stylesheet" href="/stylesheets/blog.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="nav-container"></div>
    <main class="blog-index">
      <h1>{{title}}</h1>
      <p class="blog-description">{{description}}</p>
      {{posts}}
    </main>
    <div id="footer-container"></div>
    <script src="/public/components.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="/public/global.js"></script>
  </body>
</html>
